<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,sans-serif;
  background:#FFF4D6; color:#4A2C2A;
}
button{font:inherit}
#app{max-width:760px;margin:0 auto;padding:18px 14px 35px}
.screen{text-align:center}
.main-img{
  width:150px;height:150px;object-fit:cover;border-radius:18px;
  margin:8px auto 10px;display:block;
}

.subtitle{font-size:20px;color:#6B4E4B;margin-bottom:18px}
.choose{font-size:24px;font-weight:700;margin:12px 0}
.topic{
  width:min(100%,520px); border:0; border-radius:14px; padding:12px 14px;

.quiz{display:none;text-align:center}

  display:block;margin:10px auto;
}
.answers{display:flex;flex-direction:column;gap:9px;margin:12px auto;width:min(100%,520px)}
.answer,.next,.back{
  border:0;border-radius:14px;padding:12px 15px;cursor:pointer;
  background:#fff;color:#4A2C2A;box-shadow:0 2px 7px rgba(74,44,42,.15);
}
.answer{font-size:18px}
.answer.correct{background:#d9f2d9}
.answer.wrong{background:#ffd6d6}
.result{font-size:20px;font-weight:700;min-height:28px;margin:7px}

.next{font-size:19px;margin-top:8px}
.back{margin-top:18px}
.hidden{display:none!important}
.end-title{font-size:30px;font-weight:700;margin:35px 0 12px}
.small{color:#6B4E4B}
</style>

<script>
const questionsByTopic = {"🐱 Животные": [{"question": "🐻‍❄️Правда ли, что белые медведи на самом деле НЕ белые?", "answers": ["Да", "Нет"], "correct": "Да", "fact": "🐻‍❄️Интересный факт:Новорожденные медвежата появляются на свет с тонким полупрозрачным пушком и «младенческой» розовой кожей. По мере взросления она становится черной или почти черной из-за высокой концентрации меланина — пигмента, который защищает от ультрафиолетового излучения. Еще темная кожа лучше поглощает солнечное тепло и помогает сохранять его в условиях Арктики.Что касается шерсти, она остается прозрачной, а за счет рассеивания и отражения света кажется белой.", "fact_image": "images/медведь.jpg", "question_image": "images/медведь1.jpg"}, {"question": "Какое животное может 'смеяться',когда его щекочут?", "answers": ["🐘 Слон", "🐀Крыса", "🐕Собака", "🦛 Бегемот"], "correct": "🐀Крыса", "fact": "Крысы издают особые ультразвуковые сигналы частотой около 50 кГц, когда их щекочут. Эти звуки недоступны человеческому уху, но фиксируются с помощью специальных приборов. По данным журнала Science, такой вариант вокализации может быть связан с получением положительных эмоций и социальным взаимодействием между особями. Как выяснилось, у крыс есть определенные участки мозга, которые отвечают за «смех» — как и у людей.", "fact_image": "images/крыса.jpg"}, {"question": "Кто может жить в космосе и обходиться без еды более 30 лет", "answers": ["🕊Птица", "🐀Крыса", "🕷Клещ", "🪱Тихоходка"], "correct": "🪱Тихоходка", "fact": "Эти микроскопические существа длиной до 0,5 мм способны переносить температуры от -273 °C до +150 °C и давление до 6000 атмосфер. Это примерно в шесть раз выше, чем на дне Марианской впадины. Все это возможно благодаря состоянию криптобиоза — тихоходки почти полностью обезвоживают организм, замедляют метаболизм до минимума и могут протянуть так без пищи и воды более 30 лет.", "fact_image": "images/тихоходка.jpg"}, {"question": "У кого из животных беременность длится 22 месяца?", "answers": ["🐘Слон", "🐢Черепаха", "🐐Коза", "🐻Вомбат"], "correct": "🐘Слон", "fact": "Беременность у слонов — самая продолжительная среди наземных животных и может длиться до 680 дней, то есть почти 22 месяца. Слоненок рождается уже физически окрепшим, а также с развитыми нервной и сенсорной системами (отвечают за координацию движений, реакцию, слух, зрение и т.д.). Это позволяет ему почти сразу включаться в социальную жизнь стада.", "fact_image": "images/слон.jpg"}, {"question": "Верно ли утверждение, что обоняние у собак в десятки раз сильнее, чем у людей", "answers": ["Нет", "Да"], "correct": "Да", "fact": "🐕У человека около 5 млн обонятельных рецепторов, у собаки их более 220 млн, а у некоторых пород, например у овчарок и гончих, около 300 млн. При этом у них сложное строение носовой полости. В момент вдоха воздух разделяется на два потока: один направляется к легким, второй — к обонятельным рецепторам. Это усиливает нюх и позволяет им «детализировать» поступающую с запахами информацию — например, различать состав еды и определять, безопасна ли она.", "fact_image": "images/собака.jpg", "question_image": "images/собака1.jpg"}], "🌆 Города": [{"question": "Какой город считается столицей романтики?", "answers": ["🇮🇹 Рим", "🇫🇷 Париж", "🇪🇸 Мадрид", "🇬🇧 Лондон"], "correct": "🇫🇷 Париж", "fact": "🗼 Париж часто называют городом любви, а Эйфелева башня стала его главным символом.", "fact_image": "images/париж.jpg"}, {"question": "Что это за город?", "answers": ["🛶Венеция", "🏰Прага", "🏙Барселона", "🐬Сочи"], "correct": "🛶Венеция", "fact": "В Венеции на весь огромный город есть только одна настоящая площадь — Сан-Марко. Все остальные открытые пространства здесь называются не площадями, а «кампо» (campo), потому что раньше они были обычными земляными лугами.", "fact_image": "images/венеция2.jpg", "question_image": "images/венеция1.jpg"}, {"question": "Какой американский город считается мировой столицей казино?", "answers": ["🏙Нью-Йорк", "🌆Техас", "🌃Лас-Вегас", "🌇Вашингтон"], "correct": "🌃Лас-Вегас", "fact": "В классических казино Лас-Вегаса намеренно нет ни окон, ни настенных часов. Это сделано для того, чтобы игроки теряли счет времени и дольше оставались за игровыми столами или автоматами.", "fact_image": "images/лас-вегас.jpg"}, {"question": "Какой город изображён на фото?", "answers": ["🇷🇺Москва", "🇮🇹Рим", "🇩🇪Берлин", "🇬🇷Афины"], "correct": "🇬🇷Афины", "fact": "Афины — один из самых старых постоянно заселенных городов Европы. Его история длится больше 3 400 лет.", "fact_image": "images/Афины2.jpg", "question_image": "images/афины1.jpg"}, {"question": "Какой китайский город считается крупнейшим мегаполисом и экономическим центром страны?", "answers": ["🌃Пекин", "🏙Токио", "🌆Шанхай", "🌇Гуанчжоу"], "correct": "🌆Шанхай", "fact": "Название города Шанхай (上海) дословно переводится как «на море» или «вверх по морю», так как он исторически вырос из рыбацкого селения у морского побережья.", "fact_image": "images/шанхай.jpg"}, {"question": "Что это за город?", "answers": ["🌇Калининград", "🌃Антананариву", "🌆Вонявки", "🏙Сидней"], "correct": "🏙Сидней", "fact": "Сидней — это самый старый и крупный город Австралии, но при этом он не является столицей страны (это звание принадлежит Канберре).", "fact_image": "images/сидней.jpg", "question_image": "images/сидней1.jpg"}], "🪇 Праздники и традиции": [{"question": "В какой стране отмечается этот праздник?", "answers": ["🇻🇳Вьетнам", "🇮🇳Индия", "🇨🇳Китай", "🇸🇴Сомали"], "correct": "🇮🇳Индия", "fact": "Холи — это традиционный индийский праздник весны и начала нового цикла, также известный как фестиваль красок. Он знаменует победу добра над злом и приход тепла. Праздник отмечается в период полнолуния (в феврале или марте) и длится несколько дней.", "fact_image": "images/холи1.jpg", "question_image": "images/холи.jpg"}, {"question": "Напомни ка мне, как называется этот праздник?", "answers": ["🧀День сыровара Егора", "🏵День мёртвых", "🪦День памяти и скорби", "🌷День цветов в Испании"], "correct": "🏵День мёртвых", "fact": "Главный символ мексиканского Дня мёртвых — яркие оранжевые бархатцы (календула). Согласно древним поверьям, их сильный запах и цвет служат ориентиром, который помогает душам умерших найти дорогу из мира мёртвых в родной дом на один день.", "fact_image": "images/деньмёртвых1.jpg", "question_image": "images/деньмёртвых.jpg"}, {"question": "Какие народы России отмечают сабантуй🎉?", "answers": ["Якуты и узбеки", "Русские и чеченцы", "Чуваши и аварцы", "Татары и башкиры"], "correct": "Татары и башкиры", "fact": "🎉Название Сабантуй переводится с тюркских языков как «праздник плуга» (сабан — плуг, туй — праздник). Изначально этот древний ритуал у татар и башкир отмечался в Портале Правительства Республики Татарстан перед началом весенних полевых работ, а сегодня его проводят в честь их окончания.", "fact_image": "images/сабантуй1.jpg", "question_image": "images/сабантуй.jpg"}, {"question": "Угадай праздник по его описанию:           Это знаменитый ежегодный фестиваль в Испании, где люди бросаются спелыми помидорами ради веселья. Праздник проходит в последнюю среду августа в городе Буньоль недалеко от Валенсии.", "answers": ["🍅День помидоров в Омске", "🥫День кетчупа", "🍅Томатина", "🥗День салата"], "correct": "🍅Томатина", "fact": " В Испании ежегодно устраивается фестиваль Томатина, целью которого является двухчасовое побоище переспелыми помидорами", "fact_image": "images/томатина.jpg"}, {"question": "Как ты думаешь, это правда?                  В Японии уже более тысячи лет проходит праздник голово мужчины", "answers": ["Нет", "Да"], "correct": "Да", "fact": "В Японии проходит день голого мужчины. В этот день мужчины ныряют в ледяную воду рек, проходя, таким образом, обряд очищения.", "fact_image": "images/деньмужчины.png"}], "🧐 История": [{"question": "Как назывался корабль, на котором Колумб отправился в своё знаменитое путешествие?", "answers": ["🚢 Санта-Мария", "🚢 Титаник", "🚢 Аврора", "🚢 Виктория"], "correct": "🚢 Санта-Мария", "fact": "🚢 Санта-Мария была крупнейшим кораблём экспедиции Колумба в 1492 году.", "fact_image": "images/корабль1.jpg", "question_image": "images/корабль.jpeg"}, {"question": "Какого числа в России отмечается День победы?", "answers": ["5 июля", "5 октября", "31 декабря", "9 мая"], "correct": "9 мая", "fact": "С 1948 по 1965 год День Победы в Советском Союзе не был праздничным выходным днём — всё это время 9 мая являлось обычным рабочим днём, а статус официального выходного празднику вернули только спустя 20 лет после окончания войны.", "fact_image": "images/победа1.jpeg", "question_image": "images/победа.jpg"}, {"question": "В каком году крестили Русь?", "answers": ["в 2026", "в 988", "в 1945", "в 1994"], "correct": "в 988", "fact": "Первые массовые крещения отдельных групп населения случались на Руси задолго до Владимира — еще в IX веке..", "fact_image": "images/крещение1.jpeg", "question_image": "images/крещение.jpeg"}, {"question": "В каком году Христофор Колумб открыл Америку?", "answers": ["в 1492", "в 2010", "в 1387", "в 901"], "correct": "в 1492", "fact": "Христофор Колумб до конца жизни был уверен, что открыл короткий путь в Индию, а не новый материк. 12 октября 1492 года его экспедиция приплыла к Багамским островам, но сам мореплаватель так и не узнал, что нашел огромный неизведанный двойной континент.", "fact_image": "images/америка.jpeg", "question_image": "images/америка1.jpg"}, {"question": "В каком году состаялся первый полёт человека в космос?", "answers": ["в 2023", "в 1981", "в 1961", "в1817"], "correct": "в 1961", "fact": "12 апреля 1961 года Юрий Гагарин совершил первый полет человека в космос на корабле «Восток-1», который длился ровно 108 минут. За это время корабль один раз обогнул земной шар.", "fact_image": "images/полёт1.jpeg", "question_image": "images/полёт.jpg"}], "📗 Литература": [{"question": "Как звали младшего сына Тараса Бульбы?", "answers": ["Андрей", "Тарас младший", "Свёкла Голова", "Андрий"], "correct": "Андрий", "fact": "Повесть Николая Гоголя «Тарас Бульба» существует в двух кардинально разных авторских редакциях — 1835 и 1842 годов. Вторая редакция почти вдвое длиннее первой, в ней писатель сильно расширил батальные и патриотические сцены, изменил акценты и добавил новые сюжетные линии.", "fact_image": "images/бульба1.jpeg", "question_image": "images/бульба.webp"}, {"question": "Угадай произведение по фото:", "answers": ["Море море край прекрасный", "Победа", "Алые паруса", "Моряк и дочка"], "correct": "Алые паруса", "fact": "Идея написать повесть-феерию «Алые паруса» пришла Александру Грину в 1916 году в Петрограде после того, как он увидел в витрине магазина игрушек лодочку с белыми шелковыми парусами. Белый цвет показался писателю скучным, и в его воображении родилась идея заменить их на яркие алые паруса.", "fact_image": "images/алыепаруса1.jpg", "question_image": "images/алыепаруса.jpg"}, {"question": "Как называется сказка, в которй девушка не получив взаимной любви, преевратилась в морскую пену?", "answers": ["Русалочка", "Бременские музыканты", "Моцарт и Сальери", "Повести Белкина"], "correct": "Русалочка", "fact": "В знаменитой сказке «Русалочка» Ганса Христиана Андерсена у главной героини нет имени — автор называет ее просто «маленькая морская дева».", "fact_image": "images/русалочка1.webp", "question_image": "images/русалочка.jpeg"}, {"question": "Что или кого утопил Герасим?", "answers": ["Барыню", "Момо", "Муму", "Кирпич"], "correct": "Муму", "fact": "Прообраз капризной барыни из рассказа И. С. Тургенева — его собственная мать, Варвара Петровна Тургенева. Она отличалась властным, суровым характером и деспотичным нравом, а реального немого дворника Андрея, который послужил прототипом Герасима, она действительно лишила возможности жить в деревне и заставила переехать в московский особняк.", "fact_image": "images/муму1.webp", "question_image": "images/муму.jpg"}, {"question": "Угадай сказку по фото:", "answers": ["Семеро козлят", "Белоснежка и семь гномов", "Золушка", "Аленький цветочек"], "correct": "Белоснежка и семь гномов", "fact": "У сказки «Белоснежка и семь гномов», которую опубликовали братья Гримм в 1812 году, есть реальный исторический прототип. Историки считают, что образ героини мог быть вдохновлен судьбой немецкой графини Марии Софии фон Эрталь, жившей в XVIII веке в городе Лор. Рядом с ее домом находились медные рудники, где из-за узких проходов работали люди низкого роста, ставшие прообразом гномов.", "fact_image": "images/белоснежка1.webp", "question_image": "images/белоснежка.png"}], "🤴 Исторические личности": [{"question": "Как звали историческую личность, которая изобрела теорию относительности?", "answers": ["Коперник", "Эпштейн", "Эйнштейн", "Да Винчи"], "correct": "Эйнштейн", "fact": "Альберт Эйнштейн ненавидел носить носки. Он считал их пустой тратой времени, так как на них вечно появлялись дырки, и часто обходился без них даже на официальных встречах и приёмах у королей.", "fact_image": "images/эйнштейн.jpg"}, {"question": "Кто был первым американским презедентом?", "answers": ["Вашингтон", "Гагарин", "Ельцин", "Абама"], "correct": "Вашингтон", "fact": "Джордж Вашингтон — первый президент США, главнокомандующий Континентальной армией и один из главных отцов-основателей государства.", "fact_image": "images/вашингтон.jpg"}, {"question": "Хотел захватить Москву, но когда это у него получилось, то город сожгли... а ещё есть такой тортик", "answers": ["Прага", "Медовик", "Лесная сказка", "Наполеон"], "correct": "Наполеон", "fact": "Наполеон родился на острове Корсика, который перешел под власть Франции незадолго до его рождения. Его родным языком был корсиканский, а французский он выучил с сильным акцентом, приехав на учебу в материковую часть в возрасте девяти лет", "fact_image": "images/наполеон.jpg"}, {"question": "Славился своим фирменным ''расстрелять''?", "answers": ["Адриан Агрест", "Путин", "Сталин", "Ленин"], "correct": "Сталин", "fact": "До революции Сталин был арестован восемь раз, отправлялся в ссылки и совершил четыре успешных побега.", "fact_image": "images/сталин.jpg"}, {"question": "В Риме - диктатор, в России - говорящий конь, а в остальном мире - салатик с курицой", "answers": ["Гомер", "Добрыня Никитич", "Илон Маск", "Цезарь"], "correct": "Цезарь", "fact": "В юности Цезаря похитили пираты и потребовали небольшой выкуп. Возмущенный столь низкой ценой за свою персону, он потребовал увеличить сумму вдвое. Освободившись, он собрал флот, нашел пиратов и казнил их, как и обещал им в шутку в плену.", "fact_image": "images/цезарь.jpg"}], "💫 Космос": [{"question": "Какая планета находится ближе всего к Солнцу?", "answers": ["🌍 Земля", "🔴 Марс", "☿️ Меркурий", "🪐 Сатурн"], "correct": "☿️ Меркурий", "fact": "☿️ Меркурий — самая близкая к Солнцу планета Солнечной системы.", "fact_image": "images/меркурий.jpg", "question_image": "images/солсистема.jpg"}, {"question": "Какой прибор используется для иследования звёздного неба?", "answers": ["Телескоп", "Микроскоп", "Фонедоскоп", "Телепорт"], "correct": "Телескоп", "fact": "Слово «телескоп» произошло от греческих слов «теле» — далеко и «скопео» — смотрю. Первый научный прибор из двух линз в трубе создал Галелио Галилей в 1609 году, хотя в продажу и для первых патентов детские игрушки-трубы подавали голландские мастера чуть раньше.", "fact_image": "images/телескоп.jpg", "question_image": "images/небо.jpg"}, {"question": "Какого учёного называют отцом космонавтики?", "answers": ["Н. Коперник", "Г. Галилей", "И. Ньютон", "К. Э. Циолковский"], "correct": "К. Э. Циолковский", "fact": "В девять лет Константин Циолковский тяжело переболел скарлатиной и почти полностью потерял слух. Из-за глухоты он не смог учиться в обычной школе, поэтому стал абсолютным самоучкой, сам освоил математику, физику и астрономию, а позже создал основы теории космических полетов.", "fact_image": "images/циолковский.jpg", "question_image": "images/буба.jpg"}, {"question": "Как звали человека, первым вышедшего в космос?", "answers": ["Юрий Гагарин", "Алан Шепард", "Алексей Лионов", "Нил Амстронг"], "correct": "Алексей Лионов", "fact": "Советский космонавт Алексей Леонов 18 марта 1965 года первым в мире вышел в открытый космос, пробыв вне корабля 12 минут и 9 секунд. Во время возвращения его скафандр раздулся от давления, и космонавт смог зайти обратно в шлюз только рискуя жизнью, сбросив давление внутри скафандра.", "fact_image": "images/лионов.jpg", "question_image": "images/космос.gif"}, {"question": "Что означает 'космос' в переводе с греческого языка?", "answers": ["Земля", "Вселенная", "Воздух", "Дорога"], "correct": "Вселенная", "fact": "Свету от Солнца нужно всего около 8 минут и 20 секунд, чтобы долететь до Земли. Когда мы смотрим на Солнце, мы видим его таким, каким оно было восемь минут назад.", "fact_image": "images/космос2.jpg", "question_image": "images/космос1.jpg"}], "💡 Изобретения": [{"question": "Кто считается изобретателем телефона?", "answers": ["А. Белл", "Т. Эдисон", "Н. Тесла", "И. Ньютон"], "correct": "А. Белл", "fact": "Александр Александр Белл предлагал использовать в качестве телефонного приветствия слово «Ahoy» (ахой), которое обычно кричали моряки. Однако прижилось более короткое и удобное «Hello» (алло), предложенное его соперником Томасом Эдисоном.                                     ВОТ К ЧЕМУ ПРИВЕЛО СОЗДАНИЕ ТЕЛЕФОНОВ", "fact_image": "images/телефон1.jpg", "question_image": "images/телефон2.jpg"}, {"question": "Как ты думаешь, сколько лет назад изобрели мыло?", "answers": ["6700 года до н.э.", "2800 года до н.э.", "5300 года до н.э.", "1300 года до н.э."], "correct": "2800 года до н.э.", "fact": "Привычное нам твердое мыло научились массово делать только в XV веке в Италии, до этого оно было жидким или пастообразным.", "fact_image": "images/мыло1.jpg", "question_image": "images/мыло.jpg"}, {"question": "Кто изобрёл лампочку?", "answers": ["Ким Пен Тяу", "А. Флеминг", "Т. Эдисон", "Цай Лунь"], "correct": "Т. Эдисон", "fact": "Томас Эдисон не изобретал лампочку с нуля. До него над созданием источников света трудились десятки ученых, включая русских инженеров Александра Лодыгина и Павла Яблочкова. Эдисон лишь усовершенствовал конструкцию и подобрал идеальную угольную нить, которая позволила сделать лампу долговечной и коммерчески успешной.", "fact_image": "images/лампочка1.jpg", "question_image": "images/лампочка.jpg"}, {"question": "В какой стране изобрели интернет?", "answers": ["В Японии", "В США", "В России", "В Канаде"], "correct": "В США", "fact": "Первое сообщение в истории прародителя интернета, сети ARPANET, едва не закончилось крушением системы в 1969 году. Ученый Чарльз Клайн хотел отправить слово «LOGIN», но система зависла ровно на третей букве, передав лишь «LO».", "fact_image": "images/интернет1.jpg", "question_image": "images/интернет.jpg"}, {"question": "Угадай изобретение по описанию:          это простой прибор для поиска сторон света (север, юг, запад, восток) и ориентации на местности.", "answers": ["Колесо", "Магнит", "Компас", "Бумага"], "correct": "Компас", "fact": "Первый компас изобрели в Китае во II веке до нашей эры во времена династии Хань. Тогда он выглядел как ложка из магнитного железняка с тонким черенком, которая свободно крутилась на гладкой медной или деревянной подставке, указывая ручкой на юг.", "fact_image": "images/компас.jpg"}], "🎬 Культовые фильмы": [{"question": "Как называется волшебная школа в фильмах о Гарри Поттере?", "answers": ["🏰 Хогвартс", "🏰 Нарния", "🏰 Хайрул", "🏰 Готэм"], "correct": "🏰 Хогвартс", "fact": "🪄 Хогвартс — школа магии и волшебства в мире Гарри Поттера.", "fact_image": "images/хогвартс.jpg"}], "✨ Всё вместе": [{"question": "Сколько планет в Солнечной системе?", "answers": ["🌍 7", "🌍 8", "🌍 9", "🌍 10"], "correct": "🌍 8", "fact": "🌌 В современной Солнечной системе официально признано 8 планет.", "fact_image": "images/солнечная_система.jpg"}]};

const menu = document.getElementById('menu');
const quiz = document.getElementById('quiz');
const topicsEl = document.getElementById('topics');
const questionEl = document.getElementById('question');
const questionImg = document.getElementById('questionImg');
const resultEl = document.getElementById('result');
const answersEl = document.getElementById('answers');
const factEl = document.getElementById('fact');
const factImg = document.getElementById('factImg');
const nextBtn = document.getElementById('next');
const backBtn = document.getElementById('back');

let questions = [];
let currentQuestion = 0;

function showImage(el, path) {
  if (!path) {
    el.classList.add('hidden');
    el.removeAttribute('src');
    return;
  }
  el.src = path;
  el.classList.remove('hidden');
  el.onerror = () => {
    el.classList.add('hidden');
  };
}

Object.keys(questionsByTopic).forEach(topic => {
  const b = document.createElement('button');
  b.className = 'topic';
  b.textContent = topic;
  b.onclick = () => openQuiz(topic);
  topicsEl.appendChild(b);
});

function openQuiz(topic) {
  questions = questionsByTopic[topic] || [];
  currentQuestion = 0;
  menu.style.display = 'none';
  quiz.style.display = 'block';
  showQuestion();
  window.scrollTo({top:0, behavior:'smooth'});
}

function showQuestion() {
  if (currentQuestion >= questions.length) {
    questionEl.innerHTML = '<div class="end-title">🎉 Викторина закончена!</div><div class="small">Ты ответил(а) на все вопросы!</div>';
    questionImg.classList.add('hidden');
    resultEl.textContent = '';
    answersEl.innerHTML = '';
    factEl.textContent = '';
    factImg.classList.add('hidden');
    nextBtn.classList.add('hidden');
    return;
  }

  const current = questions[currentQuestion];
  questionEl.textContent = current.question || '';
  resultEl.textContent = '';
  factEl.textContent = '';
  factImg.classList.add('hidden');
  nextBtn.classList.add('hidden');
  answersEl.innerHTML = '';

  showImage(questionImg, current.question_image);

  (current.answers || []).forEach(answer => {
    const b = document.createElement('button');
    b.className = 'answer';
    b.textContent = answer;
    b.onclick = () => checkAnswer(answer, b);
    answersEl.appendChild(b);
  });
}

function checkAnswer(answer, clickedButton) {
  const current = questions[currentQuestion];
  const correct = answer === current.correct;

  resultEl.textContent = correct ? 'Правильно! 🎉' : 'Неправильно! 😿';
  resultEl.style.color = correct ? '#2E7D32' : '#C62828';

  // Как в твоей программе: картинка вопроса и варианты ответа исчезают.
  questionImg.classList.add('hidden');
  answersEl.innerHTML = '';

  factEl.textContent = current.fact || '';
  showImage(factImg, current.fact_image);
  nextBtn.classList.remove('hidden');

  window.scrollTo({top:0, behavior:'smooth'});
}

nextBtn.onclick = () => {
  currentQuestion++;
  showQuestion();
  window.scrollTo({top:0, behavior:'smooth'});
};

backBtn.onclick = () => {
  quiz.style.display = 'none';
  menu.style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
};
</script>
</body>
</html>
